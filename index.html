    <body>
        <header class="header">
            <h1 class="site-title">Portfolio</h1>
            <nav class="global-navigation">
                <button class="header-link mail" aria-label="copy mailaddress" data-label="Click to copy"><img class="icon" src="images/mail.svg" alt="Mail"></button>
                <a class="header-link" href="https://github.com/nilferum?tab=repositories" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub""><img class="icon" src="images/github.svg" alt="GitHub Repository"></a>
            </nav>
        </header>

        <main>
            <section class="outline">
                <div class="outline__texture" aria-hidden="true"></div>
                <h2 class="visually-hidden">作品一覧</h2>
                <figure class="splide">
                    <div class="splide__track">
                        <ul class="splide__list"></ul>
                    </div>
                    <figcaption class="workpanel">
                        <h3 class="workpanel__title"></h3>
                        <ul class="workpanel__scopelabels"></ul>
                        <p class="workpanel__description"></p>
                        <button class="workpanel__button chevron" aria-label="詳細を見る"></button>
                    </figcaption>
                </figure>
            </section>

            <section class="detail" aria-hidden="true">
                <h3 class="detail__title abs"></h3>
                <button class="detail__button abs" aria-label="閉じる"></button>
                <article class="detail__contents"></article>
                <div class="detail__scrolltrack abs"><div class="detail__scrollthumb abs"></div></div>
                <nav class="detail__keyguide">
                    <div class="abs chevron leftkey"></div>
                    <div class="abs chevron rightkey"></div>
                </nav>
            </section>

            <div class="scrim"></div>
        </main>

        <footer class="footer">
